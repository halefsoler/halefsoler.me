kind = "web"
previewPath = "/"
title = "halefsoler.io"
version = "1.0.0"
id = "artifacts/halefsoler-brand"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19154

[services.development]
run = "pnpm --filter @workspace/halefsoler-brand run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/halefsoler-brand", "run", "build" ]
publicDir = "artifacts/halefsoler-brand/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19154"
BASE_PATH = "/"
